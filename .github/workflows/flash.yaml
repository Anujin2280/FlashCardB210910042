name: Java CI with Maven

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # - name: Build with Maven
    #   working-directory: FlashCardB210910042/BiyDaalt
    #   run: mvn -B package

    # - name: Run JUnit tests
    #   working-directory: FlashCardB210910042/BiyDaalt
    #   run: mvn test

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Run JUnit tests
      run: mvn test